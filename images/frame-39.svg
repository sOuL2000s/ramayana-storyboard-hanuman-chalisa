<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg39" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a33"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b38f00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg39)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <circle cx="700" cy="80" r="40" fill="#80d8ff" filter="url(#glow)"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(0, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(30, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(60, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(90, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(120, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(150, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(180, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(210, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(240, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(270, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(300, 700, 80)" opacity="0.5"/><line x1="700" y1="80" x2="700" y2="20" stroke="#80d8ff" stroke-width="2" transform="rotate(330, 700, 80)" opacity="0.5"/><circle cx="400" cy="150" r="100" fill="white" opacity="0.05" filter="url(#glow)"/><path d="M 0 400 Q 400 450 800 400 L 800 500 L 0 500 Z" fill="#003366" opacity="0.6"/>

  <!-- Decorative Border -->
  <rect x="15" y="15" width="770" height="470" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <rect x="30" y="30" width="740" height="440" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="15,10" opacity="0.5"/>

  <!-- Main Illustration -->
  <g transform="translate(0, -20)">
    <path d="M 0 400 Q 400 480 800 400 L 800 500 L 0 500 Z" fill="#00b0ff" opacity="0.5"/><rect x="150" y="380" width="500" height="40" fill="#666" stroke="#80d8ff"/>
  </g>

  <!-- Title Plate -->
  <g transform="translate(400, 440)">
    <rect x="-320" y="-35" width="640" height="70" rx="20" fill="black" fill-opacity="0.8" stroke="url(#goldGrad)" stroke-width="3"/>
    <text y="10" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle">39. BUILDING THE RAMA SETU</text>
  </g>
</svg>