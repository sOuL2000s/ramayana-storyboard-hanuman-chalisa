<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a33"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b38f00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg12)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <circle cx="700" cy="80" r="40" fill="#80d8ff" filter="url(#glow)"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(0.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(22.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(45.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(67.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(90.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(112.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(135.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(157.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(180.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(202.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(225.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(247.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(270.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(292.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(315.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" transform="rotate(337.5, 700, 80)" opacity="0.7"/><circle cx="400" cy="150" r="100" fill="white" opacity="0.05" filter="url(#glow)"/><path d="M 0 400 Q 400 450 800 400 L 800 500 L 0 500 Z" fill="#003366" opacity="0.6"/>

  <!-- Decorative Border -->
  <rect x="15" y="15" width="770" height="470" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <rect x="30" y="30" width="740" height="440" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="15,10" opacity="0.5"/>

  <!-- Main Illustration -->
  <g transform="translate(0, -20)">
    <path d="M 200 300 Q 350 100 390 280" fill="none" stroke="#80d8ff" stroke-width="10"/><path d="M 410 280 Q 450 100 600 300" fill="none" stroke="#80d8ff" stroke-width="10"/><circle cx="400" cy="250" r="30" fill="white" filter="url(#glow)"/>
  </g>

  <!-- Title Plate -->
  <g transform="translate(400, 440)">
    <rect x="-320" y="-35" width="640" height="70" rx="20" fill="black" fill-opacity="0.8" stroke="url(#goldGrad)" stroke-width="3"/>
    <text y="10" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle">12. RAMA BREAKS THE BOW</text>
  </g>
</svg>