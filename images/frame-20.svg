<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0b00"/>
      <stop offset="100%" stop-color="#5d1a1a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b38f00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg20)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <circle cx="700" cy="80" r="40" fill="#ffd700" filter="url(#glow)"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(0.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(22.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(45.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(67.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(90.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(112.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(135.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(157.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(180.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(202.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(225.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(247.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(270.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(292.5, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(315.0, 700, 80)" opacity="0.7"/><line x1="700" y1="80" x2="700" y2="15" stroke="#ffd700" stroke-width="3" stroke-linecap="round" transform="rotate(337.5, 700, 80)" opacity="0.7"/><rect x="0" y="300" width="800" height="100" fill="#3d1212" opacity="0.3"/><path d="M 0 300 L 800 300" stroke="#ffd700" stroke-width="2" stroke-dasharray="10,10"/>

  <!-- Decorative Border -->
  <rect x="15" y="15" width="770" height="470" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <rect x="30" y="30" width="740" height="440" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="15,10" opacity="0.5"/>

  <!-- Main Illustration -->
  <g transform="translate(0, -20)">
    <rect x="200" y="350" width="400" height="60" fill="#8b4513" stroke="#ffd700"/><g transform="translate(400,280) scale(1)"><circle cx="0" cy="-5" r="35" fill="#ffd700" opacity="0.12" filter="url(#glow)"/><path d="M -15 -18 C -15 -35 15 -35 15 -18 C 18 -10 15 5 15 5 L -15 5 C -15 5 -18 -10 -15 -18 Z" fill="#2b1810"/><circle cx="0" cy="0" r="18" fill="#ffcc99" stroke="#ffd700" stroke-width="0.8"/><circle cx="-5" cy="-2" r="2" fill="#333"/><circle cx="5" cy="-2" r="2" fill="#333"/><path d="M -3 5 Q 0 8 3 5" fill="none" stroke="#333" stroke-width="1.2"/><path d="M -16 -14 L -20 -35 L -8 -22 L 0 -42 L 8 -22 L 20 -35 L 16 -14 Z" fill="url(#goldGrad)" filter="url(#glow)" stroke="#b38f00" stroke-width="1"/><circle cx="0" cy="-30" r="4" fill="#ff3333"/><circle cx="-12" cy="-25" r="2.5" fill="#33ff33"/><circle cx="12" cy="-25" r="2.5" fill="#3333ff"/><path d="M -22 18 Q 0 15 22 18 L 35 85 L 18 90 L 0 75 L -18 90 L -35 85 Z" fill="#ff8c00" stroke="#ffd700" stroke-width="1.5"/><path d="M -15 18 L 15 18 L 22 55 L -22 55 Z" fill="#ffd700" opacity="0.25"/><path d="M -10 20 Q 0 35 10 20" fill="none" stroke="#ffd700" stroke-width="2.5"/><circle cx="0" cy="30" r="3" fill="#ff4444"/></g>
  </g>

  <!-- Title Plate -->
  <g transform="translate(400, 440)">
    <rect x="-320" y="-35" width="640" height="70" rx="20" fill="black" fill-opacity="0.8" stroke="url(#goldGrad)" stroke-width="3"/>
    <text y="10" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle">20. DEPARTURE FROM AYODHYA</text>
  </g>
</svg>